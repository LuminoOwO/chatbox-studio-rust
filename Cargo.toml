[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/LuminoOwO/chatbox-studio-rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
fancy-regex = "0.14"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
rand = "0.8"
mdns-sd = "0.21"
if-addrs = "0.15"
socket2 = { version = "0.6", features = ["all"] }
cbs-core = { path = "crates/cbs-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
